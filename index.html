<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Kanit', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.5s;
}

/* 🌞 Light Mode */
body.light {
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
}

/* 🌙 Dark Mode */
body.dark {
    background: linear-gradient(135deg, #141e30, #243b55);
}

/* กล่องฟอร์ม */
.form-container {
    width: 350px;
    padding: 30px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    transition: 0.5s;

    /* animation ตอนโหลด */
    animation: fadeIn 1s ease;
}

/* Light */
body.light .form-container {
    background: rgba(255,255,255,0.9);
    color: black;
}

/* Dark */
body.dark .form-container {
    background: rgba(0,0,0,0.6);
    color: white;
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* input */
.form-control {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
    outline: none;
}

/* Light input */
body.light .form-control {
    background: #f1f1f1;
}

/* Dark input */
body.dark .form-control {
    background: #333;
    color: white;
}

/* focus */
.form-control:focus {
    box-shadow: 0 0 5px #7b5cff;
}

/* ปุ่ม */
button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

/* Light button */
body.light button {
    background: #ff72ce;
    color: white;
}

/* Dark button */
body.dark button {
    background: #9c4747;
    color: black;
}

/* hover + animation */
button:hover {
    transform: scale(1.05);
}

/* ปุ่มสลับโหมด */
.toggle-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}
</style>

</head>

<body class="light">

<button class="toggle-btn" onclick="toggleMode()">🌙 Dark</button>

<div class="form-container">
    <h2>Register</h2>

    <form>
        ชื่อ
        <input class="form-control" placeholder="กรอกชื่อ">

        นามสกุล
        <input class="form-control" placeholder="กรอกนามสกุล">

        อายุ
        <input type="number" class="form-control">

        เพศ <br>
        <input type="radio" name="gender"> ชาย
        <input type="radio" name="gender"> หญิง
        <br><br>

        งานอดิเรก <br>
        <input type="checkbox"> อ่านหนังสือ
        <input type="checkbox"> ท่องเที่ยว
        <input type="checkbox"> กีฬา
        <br><br>

        คำอธิบายตัวเอง
        <textarea class="form-control"></textarea>

        <button type="submit">สมัคร</button>
    </form>
</div>

<script>
function toggleMode() {
    const body = document.body;
    const btn = document.querySelector('.toggle-btn');

    if (body.classList.contains('light')) {
        body.classList.remove('light');
        body.classList.add('dark');
        btn.innerText = "☀️ Light";
    } else {
        body.classList.remove('dark');
        body.classList.add('light');
        btn.innerText = "🌙 Dark";
    }
}
</script>

</body>
</html>
